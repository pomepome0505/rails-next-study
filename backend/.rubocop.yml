# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable

# 日本語でcontextを書いているため、when/with/withoutの規約は適用しない
RSpec/ContextWording:
  Enabled: false

# リクエストspecではステータスとボディの両方を検証するため
RSpec/MultipleExpectations:
  Max: 5

# レスポンス構造をmatchで一括検証するexampleがあるため
RSpec/ExampleLength:
  Max: 45

RSpec/NestedGroups:
  Max: 4