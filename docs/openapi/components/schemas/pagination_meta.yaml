type: object
description: ページネーション情報
required:
  - current_page
  - per_page
  - total_pages
  - total_count
  - next_page
  - prev_page
properties:
  current_page:
    type: integer
    description: 現在のページ番号
    examples: [1]
  per_page:
    type: integer
    description: 1ページあたりの件数
    examples: [10]
  total_pages:
    type: integer
    description: 総ページ数
    examples: [3]
  total_count:
    type: integer
    description: 総件数
    examples: [25]
  next_page:
    type: [integer, "null"]
    description: 次のページ番号。存在しない場合は null
    examples: [2]
  prev_page:
    type: [integer, "null"]
    description: 前のページ番号。存在しない場合は null
    examples: [null]