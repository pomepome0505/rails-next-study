type: object
description: ユーザー
required:
  - id
  - name
  - email
properties:
  id:
    type: integer
    description: ユーザーID
    examples: [1]
  name:
    type: string
    description: 表示名
    examples: ["Alice"]
  email:
    type: string
    format: email
    description: メールアドレス
    examples: ["alice@example.com"]